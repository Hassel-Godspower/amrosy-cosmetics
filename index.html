<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Validation</title>

<meta name="description" content="Official product validation result">
<meta name="robots" content="noindex, nofollow">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0b0f19;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.validation-container {
  width: 100%;
  max-width: 420px;
  padding: 2.5rem 1.5rem;
  text-align: center;
}

/* =====================
   LOADING STATE
===================== */
.loader {
  font-size: 1.1rem;
  color: #9ca3af;
  letter-spacing: 0.08em;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

/* =====================
   APPROVAL (HIDDEN INITIALLY)
===================== */
.approval-ring {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 6px solid rgba(34,197,94,0.2);
  display: none;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  position: relative;
}

.approval-ring.animate::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 6px solid #22c55e;
  border-top-color: transparent;
  animation: spin 1.2s ease-out forwards;
}

.checkmark {
  font-size: 3.2rem;
  color: #22c55e;
  opacity: 0;
  transform: scale(0.5);
}

.checkmark.show {
  animation: pop 0.4s ease-out forwards;
  animation-delay: 1.1s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pop {
  to { opacity: 1; transform: scale(1); }
}

/* =====================
   TEXT
===================== */
.status-text {
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  margin-bottom: 0.5rem;
  color: #22c55e;
  display: none;
}

.sub-text {
  color: #9ca3af;
  font-size: 0.95rem;
  margin-bottom: 2rem;
  display: none;
}

/* =====================
   BRAND INFO
===================== */
.info-box {
  background: #111827;
  border-radius: 1rem;
  padding: 1.4rem;
  text-align: left;
  font-size: 0.9rem;
  line-height: 1.7;
  display: none;
}

.info-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #1f2933;
  padding: 0.5rem 0;
}

.info-row:last-child { border-bottom: none; }

.label { color: #9ca3af; }
.value { font-weight: 600; color: #e5e7eb; }

.footer {
  margin-top: 2rem;
  font-size: 0.75rem;
  color: #6b7280;
  display: none;
}
</style>
</head>

<body>

<div class="validation-container">

  <!-- INITIAL LOADING -->
  <div class="loader" id="loader">
    VALIDATING PRODUCT…
  </div>

  <!-- APPROVAL -->
  <div class="approval-ring" id="ring">
    <div class="checkmark" id="check">✔</div>
  </div>

  <div class="status-text" id="status">APPROVED</div>
  <div class="sub-text" id="sub">
    This product has been successfully authenticated
  </div>

  <div class="info-box" id="info">
    <div class="info-row">
      <span class="label">Brand</span>
      <span class="value">GENUINE™</span>
    </div>
    <div class="info-row">
      <span class="label">Verification Time</span>
      <span class="value" id="time"></span>
    </div>
    <div class="info-row">
      <span class="label">Status</span>
      <span class="value">Authentic Product</span>
    </div>
  </div>

  <div class="footer" id="footer">
    © <span id="year"></span> Official Validation System
  </div>

</div>

<script>
/* Simulate real server validation */
setTimeout(() => {
  document.getElementById("loader").style.display = "none";

  document.getElementById("ring").style.display = "flex";
  document.getElementById("ring").classList.add("animate");

  document.getElementById("check").classList.add("show");

  document.getElementById("status").style.display = "block";
  document.getElementById("sub").style.display = "block";
  document.getElementById("info").style.display = "block";
  document.getElementById("footer").style.display = "block";

  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("time").textContent = new Date().toLocaleString();

}, 1800); // realistic validation delay
</script>

</body>
</html>
